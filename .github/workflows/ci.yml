name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Electrobun 2.x projects its SDK into .hutch/devkit; typecheck resolves
      # `electrobun/*` there — see docs/adr/0017.
      - run: bunx electrobun sync
      - run: bun run build:native
      - run: bun run format -- --check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run e2e:install
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: tests/output/results
          retention-days: 7
